<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>

<body>
  <div class="sidebar-header">
    <div class="header-logo">
      <img src="../assets/breezecat.png" alt="BreezeCat" />
      <span>BreezeCat</span>
    </div>
    <button id="settingsBtn" aria-label="설정">
      <img src="../assets/setting.png" alt="설정" />
    </button>
  </div>
  
  <div class="sidebar-content-area">
    <div class="section-panel-filterPanel hidden">
        <div class="panel-header">
            <h3>추천 필터 설정</h3>
            <button id="closePanelBtn" aria-label="닫기">
                <span class="close-icon">&times;</span>
            </button>
        </div>
  
        <div class="panel-content">
            <div class="filter-group">
                <label>성별:</label>
                <div class="gender-selection">
                    <input type="radio" id="genderMale" name="gender" value="male">
                    <label for="genderMale">남</label>
                    <input type="radio" id="genderFemale" name="gender" value="female">
                    <label for="genderFemale">여</label>
                </div>
            </div>
  
            <div class="filter-group">
                <label for="ageGroup">연령대:</label>
                <select id="ageGroup">
                    <option value="">선택 안 함</option>
                    <option value="1">0~12세</option>
                    <option value="2">13~18세</option>
                    <option value="3">19~24세</option>
                    <option value="4">25~29세</option>
                    <option value="5">30~34세</option>
                    <option value="6">35~39세</option>
                    <option value="7">40~44세</option>
                    <option value="8">45~49세</option>
                    <option value="9">50~54세</option>
                    <option value="10">55~59세</option>
                    <option value="11">60세 이상</option>
                </select>
            </div>
  
            <button id="applyFilterBtn">필터 적용</button>
        </div>
    </div>
    <div class="section-panel time-prediction">
      <div class="section-title">예상 소요 시간</div>
      <div id="readTime">
          <span class="time-value">2분</span>
          <span class="read-recommend">로딩 중...</span>
        </div>
      </div>

      <hr />

      <div class="section-panel summary-section">
        <div class="section-title">핵심 요약</div>
        <div id="summaryArea">
          <ol>
            <li class="summary-sentence">
              핵심 요약 1. 중요한 문장을 간결하게 보여줍니다.
            </li>
            <li class="summary-sentence">
              핵심 요약 2. 두 번째 요약 문장 예시입니다.
            </li>
            <li class="summary-sentence">
              핵심 요약 3. 세 번째 문장 예시로 마무리합니다.
            </li>
          </ol>
        </div>
      </div>

      <hr />

        <div class="section-panel keyword-section">
    <div class="section-title">핵심 키워드</div>
    <div id="keywordArea">
        <!-- JS에서 동적으로 키워드 삽입 -->
      </div>
    </div>

      <hr />

        <!-- 뉴스 추천 섹션 -->
    <div class="section-panel news-recommendation">
      <div class="section-title">관련 뉴스 추천</div>
      <div id="recommendationArea" class="news-list">
        <!-- JS에서 news-item 반복 생성 -->
      </div>
    </div>

      <hr />

      <div class="section-panel bookmark-section">
        <div class="section-title">최근 북마크</div>
        <div id="bookmarkArea">
          <div id="bookmarkFolderArea"></div>
          <!-- JS가 여기다가 폴더 목록을 넣어줌 -->
          <div class="bookmark-action-bar">
            <button class="saveBtn">저장</button>
            <button class="loadBtn">불러오기</button>
          </div>
        </div>
      </div>
      </div> 
    </div>
  </body>
</html>
